<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수원 지역 공공데이터 대시보드</title>
  <style>
    :root {
      --navy: #102a43;
      --blue: #1976d2;
      --sky: #e7f2ff;
      --green: #18a67d;
      --muted: #6b7c93;
      --white: #fff;
      --shadow: 0 14px 35px rgba(16, 42, 67, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--navy);
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(135deg, #eef7ff, #f7fbff 55%, #e9fff8);
    }

    header {
      padding: 35px 20px 25px;
      text-align: center;
    }

    h1 { margin: 0 0 9px; font-size: clamp(25px, 5vw, 39px); }
    header p { margin: 0; color: var(--muted); }

    main { width: min(960px, calc(100% - 32px)); margin: 0 auto 50px; }

    .key-box, .dashboard {
      padding: 22px;
      border: 1px solid rgba(25, 118, 210, .12);
      border-radius: 20px;
      background: rgba(255, 255, 255, .93);
      box-shadow: var(--shadow);
    }

    .key-row { display: flex; gap: 10px; }
    .key-row input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #cbd9e6;
      border-radius: 11px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 700;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: translateY(-2px); }

    .save-btn { padding: 0 22px; color: white; background: var(--blue); }
    .help { margin: 10px 2px 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 24px 0; }
    .menu button {
      padding: 26px 16px;
      color: white;
      font-size: 20px;
      box-shadow: var(--shadow);
    }
    .weather-btn { background: linear-gradient(135deg, #1976d2, #43a5ef); }
    .dust-btn { background: linear-gradient(135deg, #128866, #2bc69b); }
    .menu .active { outline: 4px solid rgba(16, 42, 67, .14); }

    .dashboard { display: none; }
    .dashboard.active { display: block; animation: show .25s ease-out; }
    @keyframes show { from { opacity: 0; transform: translateY(8px); } }

    .dash-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dash-head h2 { margin: 0; font-size: 24px; }
    .refresh { padding: 10px 15px; color: var(--blue); background: var(--sky); }

    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 22px; }
    .card { min-height: 155px; padding: 24px; border-radius: 17px; background: #f5f9fd; }
    .card .label { color: var(--muted); font-size: 15px; }
    .value { margin-top: 18px; font-size: clamp(34px, 7vw, 52px); font-weight: 800; }
    .unit { margin-left: 4px; font-size: 18px; font-weight: 600; color: var(--muted); }
    .grade { margin-top: 9px; font-weight: 800; }
    .meta { margin: 20px 2px 0; color: var(--muted); font-size: 14px; }
    .message { min-height: 22px; margin: 14px 2px 0; font-size: 14px; color: #d14343; }
    .loading { opacity: .55; }

    footer { padding: 0 15px 25px; text-align: center; color: var(--muted); font-size: 13px; }

    @media (max-width: 620px) {
      .key-row, .dash-head { align-items: stretch; flex-direction: column; }
      .save-btn { padding: 13px; }
      .menu, .cards { grid-template-columns: 1fr; }
      .menu button { padding: 20px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>수원 지역 공공데이터 대시보드</h1>
    <p>수원의 기상 정보와 인계동 측정소의 대기질을 확인합니다.</p>
  </header>

  <main>
    <section class="key-box">
      <div class="key-row">
        <input id="serviceKey" type="password" placeholder="공공데이터포털 일반 인증키(Decoding)를 입력하세요">
        <button class="save-btn" onclick="saveKey()">인증키 저장</button>
      </div>
      <p class="help">인증키는 이 브라우저에만 저장되며 GitHub에 올라가지 않습니다. 기상청 단기예보 조회서비스와 에어코리아 대기오염정보 API의 활용신청이 필요합니다.</p>
    </section>

    <nav class="menu" aria-label="대시보드 선택">
      <button id="weatherButton" class="weather-btn" onclick="openDashboard('weather')">🌡️ 온·습도 대시보드</button>
      <button id="dustButton" class="dust-btn" onclick="openDashboard('dust')">🌿 미세먼지 대시보드</button>
    </nav>

    <section id="weather" class="dashboard">
      <div class="dash-head">
        <h2>수원 온·습도</h2>
        <button class="refresh" onclick="loadWeather()">새로고침</button>
      </div>
      <div class="cards">
        <article class="card">
          <div class="label">현재 기온</div>
          <div class="value"><span id="temperature">--</span><span class="unit">℃</span></div>
        </article>
        <article class="card">
          <div class="label">현재 습도</div>
          <div class="value"><span id="humidity">--</span><span class="unit">%</span></div>
        </article>
      </div>
      <p id="weatherMeta" class="meta">기상청 초단기실황 · 수원 격자(60, 121)</p>
      <p id="weatherMessage" class="message"></p>
    </section>

    <section id="dust" class="dashboard">
      <div class="dash-head">
        <h2>수원 미세먼지</h2>
        <button class="refresh" onclick="loadDust()">새로고침</button>
      </div>
      <div class="cards">
        <article class="card">
          <div class="label">미세먼지 PM10</div>
          <div class="value"><span id="pm10">--</span><span class="unit">㎍/㎥</span></div>
          <div id="pm10Grade" class="grade"></div>
        </article>
        <article class="card">
          <div class="label">초미세먼지 PM2.5</div>
          <div class="value"><span id="pm25">--</span><span class="unit">㎍/㎥</span></div>
          <div id="pm25Grade" class="grade"></div>
        </article>
      </div>
      <p id="dustMeta" class="meta">한국환경공단 에어코리아 · 인계동 측정소</p>
      <p id="dustMessage" class="message"></p>
    </section>
  </main>

  <footer>데이터 출처: 기상청 · 한국환경공단 에어코리아</footer>

  <script>
    const WEATHER_URL = "https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst";
    const DUST_URL = "https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty";

    const keyInput = document.getElementById("serviceKey");
    keyInput.value = localStorage.getItem("publicDataServiceKey") || "";

    function saveKey() {
      const key = keyInput.value.trim();
      if (!key) return alert("공공데이터포털 일반 인증키(Decoding)를 입력해 주세요.");
      localStorage.setItem("publicDataServiceKey", key);
      alert("인증키를 이 브라우저에 저장했습니다.");
    }

    function getKey() {
      const key = keyInput.value.trim();
      if (!key) throw new Error("먼저 공공데이터포털 인증키를 입력해 주세요.");
      return key;
    }

    function openDashboard(name) {
      document.querySelectorAll(".dashboard").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".menu button").forEach(el => el.classList.remove("active"));
      document.getElementById(name).classList.add("active");
      document.getElementById(name + "Button").classList.add("active");
      name === "weather" ? loadWeather() : loadDust();
    }

    function weatherBaseTime() {
      const now = new Date(Date.now() + 9 * 60 * 60 * 1000); // UTC → KST
      if (now.getUTCMinutes() < 40) now.setUTCHours(now.getUTCHours() - 1);
      const yyyy = now.getUTCFullYear();
      const mm = String(now.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(now.getUTCDate()).padStart(2, "0");
      const hh = String(now.getUTCHours()).padStart(2, "0");
      return { date: `${yyyy}${mm}${dd}`, time: `${hh}00` };
    }

    async function loadWeather() {
      const panel = document.getElementById("weather");
      const message = document.getElementById("weatherMessage");
      message.textContent = "";
      panel.classList.add("loading");

      try {
        const key = getKey();
        const base = weatherBaseTime();
        const params = new URLSearchParams({
          serviceKey: key, pageNo: "1", numOfRows: "100", dataType: "JSON",
          base_date: base.date, base_time: base.time, nx: "60", ny: "121"
        });
        const response = await fetch(`${WEATHER_URL}?${params}`);
        if (!response.ok) throw new Error(`기상 API 응답 오류(${response.status})`);
        const data = await response.json();
        const header = data.response?.header;
        if (header?.resultCode !== "00") throw new Error(header?.resultMsg || "기상 데이터를 받지 못했습니다.");
        const items = data.response?.body?.items?.item || [];
        const temp = items.find(item => item.category === "T1H");
        const humid = items.find(item => item.category === "REH");
        if (!temp || !humid) throw new Error("온도 또는 습도 항목이 없습니다.");
        document.getElementById("temperature").textContent = temp.obsrValue;
        document.getElementById("humidity").textContent = humid.obsrValue;
        document.getElementById("weatherMeta").textContent = `기상청 초단기실황 · ${base.date} ${base.time.slice(0, 2)}시 기준`;
      } catch (error) {
        message.textContent = "⚠️ " + error.message;
      } finally {
        panel.classList.remove("loading");
      }
    }

    async function loadDust() {
      const panel = document.getElementById("dust");
      const message = document.getElementById("dustMessage");
      message.textContent = "";
      panel.classList.add("loading");

      try {
        const key = getKey();
        const params = new URLSearchParams({
          serviceKey: key, returnType: "json", numOfRows: "1", pageNo: "1",
          stationName: "인계동", dataTerm: "DAILY", ver: "1.3"
        });
        const response = await fetch(`${DUST_URL}?${params}`);
        if (!response.ok) throw new Error(`대기 API 응답 오류(${response.status})`);
        const data = await response.json();
        const header = data.response?.header;
        if (header?.resultCode !== "00") throw new Error(header?.resultMsg || "대기 데이터를 받지 못했습니다.");
        const item = data.response?.body?.items?.[0];
        if (!item) throw new Error("인계동 측정소 데이터가 없습니다.");
        document.getElementById("pm10").textContent = validValue(item.pm10Value);
        document.getElementById("pm25").textContent = validValue(item.pm25Value);
        setGrade("pm10Grade", Number(item.pm10Value), "pm10");
        setGrade("pm25Grade", Number(item.pm25Value), "pm25");
        document.getElementById("dustMeta").textContent = `에어코리아 · 인계동 측정소 · ${item.dataTime || "측정시각 없음"}`;
      } catch (error) {
        message.textContent = "⚠️ " + error.message;
      } finally {
        panel.classList.remove("loading");
      }
    }

    function validValue(value) {
      return value && value !== "-" ? value : "자료없음";
    }

    function setGrade(id, value, type) {
      const element = document.getElementById(id);
      if (!Number.isFinite(value)) {
        element.textContent = "등급: 자료없음";
        element.style.color = "#6b7c93";
        return;
      }
      const limits = type === "pm10" ? [30, 80, 150] : [15, 35, 75];
      const grades = [
        ["좋음", "#1683d8"], ["보통", "#15966f"],
        ["나쁨", "#e28b19"], ["매우 나쁨", "#d14343"]
      ];
      const index = value <= limits[0] ? 0 : value <= limits[1] ? 1 : value <= limits[2] ? 2 : 3;
      element.textContent = `등급: ${grades[index][0]}`;
      element.style.color = grades[index][1];
    }
  </script>
</body>
</html>
